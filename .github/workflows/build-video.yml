name: Build Movie Teller Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download free Urdu voice model
        run: |
          mkdir -p models
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx" -o models/ur_PK-fasih-medium.onnx
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx.json" -o models/ur_PK-fasih-medium.onnx.json

      - name: Render video
        run: python scripts/build_video.py episodes/episode-001.json

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: hansizappo-movie-teller-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
