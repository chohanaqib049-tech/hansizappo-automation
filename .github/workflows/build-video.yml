name: Build Movie Teller Video

on:
  workflow_dispatch:
    inputs:
      episode_file:
        description: "Episode JSON path to render"
        required: true
        type: string
        default: "episodes/episode-002.json"
      upload_to_youtube:
        description: "Upload the rendered video to YouTube as PRIVATE (never public automatically)"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/build_shorts.py"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download free Urdu voice model
        run: |
          mkdir -p models
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx" -o models/ur_PK-fasih-medium.onnx
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx.json" -o models/ur_PK-fasih-medium.onnx.json
      - name: Download free NASA Mars rover footage
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p assets
          curl -fL --retry 3 "https://svs.gsfc.nasa.gov/vis/a030000/a031200/a031276/MSL_hazcam_timelapse_sol_4002_PIA26209_1080.webm" -o assets/mars-rover-hazcam.mp4
      - name: Render 10 vertical AAKHRI SIGNAL Shorts
        if: github.event_name == 'push'
        run: python scripts/build_shorts.py
      - name: Render selected long-form episode
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_video.py "${{ inputs.episode_file }}"
      - name: Upload to YouTube privately (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py output/*.mp4 publishing/the-martian-episode-002-metadata.json
      - name: Save rendered videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hansizappo-aakhri-signal-shorts
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
